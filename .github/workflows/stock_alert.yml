name: 台股短線篩選器

on:
  # 2026-10-28 停用排程：回測（2024/10～2026/10）持有 1/3/5 天期望值皆為負，帳戶 -46%～-90%
  # 要恢復就把下面兩行的 # 拿掉
  # schedule:
  #   - cron: '0,5,10,15,20,25,30,35,40,45,50,55 1-5 * * 1-5'   # 台北 09:00-13:55 每 5 分鐘
  workflow_dispatch:    # 手動觸發（測試用）

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # 防止超時卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: 確認台北時間
        run: |
          TZ=Asia/Taipei date
          echo "UTC: $(date -u)"

      - name: 執行篩選器
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cd $GITHUB_WORKSPACE
          python screener.py
